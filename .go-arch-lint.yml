version: 3
workdir: .
allow:
  depOnAnyVendor: true

components:
  main: { in: cmd/insight }
  config: { in: cmd/insight/internal/config }
  storage: { in: cmd/insight/internal/storage }
  http: { in: cmd/insight/internal/http }
  events: { in: cmd/insight/internal/events }
  db: { in: cmd/insight/internal/storage/db }
  migrations: { in: cmd/insight/internal/storage/migrations }
  testutil: { in: cmd/insight/internal/testutil }
  research: { in: cmd/insight/internal/research }

deps:
  main:
    mayDependOn:
      - main
      - config
      - storage
      - http
      - events
      - db
      - research
      - migrations
  config:
    mayDependOn:
      - config
  storage:
    mayDependOn:
      - storage
      - events
      - db
      - migrations
      - testutil
  http:
    mayDependOn:
      - http
      - storage
      - events
      - research
      - db
      - testutil
  events:
    mayDependOn:
      - events
  db:
    mayDependOn:
      - db
  migrations:
    mayDependOn:
      - migrations
  research:
    mayDependOn:
      - research
      - config
      - db
      - testutil
  testutil:
    mayDependOn:
      - testutil
      - storage
      - http
      - events
